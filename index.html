": 11, "q": "下列哪個標籤用來建立段落？", "options": ["<h1>", "<p>", "<img>", "<hr>"], "extra": "", "answer": 1, "note": ""}, {"id": "m12", "type": "選擇題", "n": 12, "q": "要表示「第一步、第二步、第三步」，以下哪個最適合？", "options": ["<ul>", "<p>", "<img>", "<ol>"], "extra": "", "answer": 3, "note": ""}, {"id": "m13", "type": "選擇題", "n": 13, "q": "網頁中主要顯示在瀏覽器畫面上的內容，通常放在哪一個標籤內？", "options": ["<head>", "<body>", "<title>", "<meta>"], "extra": "", "answer": 1, "note": ""}, {"id": "m14", "type": "選擇題", "n": 14, "q": "在 <img> 標籤中，width 用來指定甚麼？", "options": ["連結位置", "圖片寬度", "圖片檔名", "網頁標題"], "extra": "", "answer": 1, "note": ""}, {"id": "m15", "type": "選擇題", "n": 15, "q": "網站與網頁的關係，哪一項最正確？", "options": ["一個網頁必定包含很多網站", "網站可由一個或多個網頁組成", "網站等同圖片檔", "網頁只能有文字"], "extra": "", "answer": 1, "note": ""}, {"id": "m16", "type": "選擇題", "n": 16, "q": "圖中網頁效果對應哪一段 HTML？", "options": ["<h1>課程資料<\/h1><ul><li>HTML<\/li><li>網頁設計<\/li><\/ul>", "<title>課程資料<\/title><ul><li>HTML<\/li><li>網頁設計<\/li><\/ul>", "<h1>課程資料<\/h1><ol><li>HTML<\/li><li>網頁設計<\/li><\/ol>", "<p>課程資料<\/p><p>HTML 網頁設計<\/p>"], "extra": "", "answer": 0, "note": "", "image": "images/4.png", "imageAlt": "課程資料：HTML 與網頁設計列表"}, {"id": "m17", "type": "選擇題", "n": 17, "q": "在 <a> 標籤中，用來指定連結網址的屬性是？", "options": ["<img>", "<td>", "href", "<body>"], "extra": "", "answer": 2, "note": ""}, {"id": "m18", "type": "選擇題", "n": 18, "q": "圖片在 images 子資料夾，正確相對路徑是哪一個？", "options": ["./images.jpg", "images/cat.jpg", "cat.jpg/images", "images\\<cat>"], "extra": "", "answer": 1, "note": ""}, {"id": "m19", "type": "選擇題", "n": 19, "q": "圖中網頁效果對應哪一段 HTML？", "options": ["<img src=\"index.html\">", "<p href=\"index.html\">前往首頁<\/p>", "<a href=\"index.html\">前往首頁<\/a>", "<title = href=\"index.html\">前往首頁<\/title>"], "extra": "", "answer": 2, "note": "", "image": "images/1.png", "imageAlt": "前往首頁超連結"}, {"id": "m21", "type": "選擇題", "n": 21, "q": "以下哪項可以解釋為甚麼 <title>我的班別<\/title> 不會像 <h1> 一樣成為網頁內的大標題？", "options": ["因為 title 只可放圖片", "因為 title 主要設定瀏覽器分頁標題", "因為 title 會自動變成連結", "因為所有 title 都是註解"], "answer": 1, "note": "", "extra": ""}, {"id": "m22", "type": "選擇題", "n": 22, "q": "某網頁和 cat.jpg 都放在同一資料夾，哪段 HTML 最適合正確顯示圖片並提供替代文字？", "options": ["<img href=\"cat.jpg\" alt=\"貓\">", "<a src=\"cat.jpg\" alt=\"貓\">", "<img src=\"cat.jpg\" alt=\"貓\">", "<img src=\"images/cat.jpg\" alt=\"貓\">"], "answer": 2, "note": "", "extra": ""}, {"id": "m23", "type": "選擇題", "n": 23, "q": "以下哪段 HTML 的開始與結束標籤先後次序完全配對？", "options": ["<p><a href=\"page2.html\">下一頁<\/p><\/a>", "<p><a href=\"page2.html\">下一頁<\/a><\/p>", "<p><a href=\"page2.html\">下一頁<\/p>", "<p><a href=\"page2.html\">下一頁<\/a>"], "answer": 1, "note": "", "extra": ""}, {"id": "m24", "type": "選擇題", "n": 24, "q": "學生把檔案命名為 index.html.txt。下列哪個判斷最準確？", "options": ["它的副檔名是 .html", "它的副檔名是 .txt", "檔名中有 html 就一定是 HTML 檔", "它一定是圖片檔"], "answer": 1, "note": "", "extra": ""}, {"id": "m25", "type": "選擇題", "n": 25, "q": "要令「校園首頁」文字連結到同一資料夾的 index.html，以下哪段最合適？", "options": ["<a href=\"index.html\">校園首頁<\/a>", "<a src=\"index.html\">校園首頁<\/a>", "<img href=\"index.html\">校園首頁", "<p href=\"index.html\">校園首頁<\/p>"], "answer": 0, "note": "", "extra": ""}, {"id": "m26", "type": "選擇題", "n": 26, "q": "以下 HTML：<table><tr><th>科目<\/th><th>分數<\/th><\/tr><tr><td>英文<\/td><td>88<\/td><\/tr><\/table>。共有幾個儲存格？", "options": ["2 個", "3 個", "4 個", "6 個"], "answer": 2, "note": "", "extra": ""}, {"id": "m27", "type": "選擇題", "n": 27, "q": "若要令一張圖片可以點擊後開啟 page2.html，以下哪段正確？", "options": ["<img src=\"page2.html\" href=\"cat.jpg\">", "<a src=\"page2.html\"><img href=\"cat.jpg\"><\/a>", "<a href=\"page2.html\"><img src=\"cat.jpg\" alt=\"小貓\"><\/a>", "<img href=\"page2.html\"><a src=\"cat.jpg\"><\/a>"], "answer": 2, "note": "", "extra": ""}, {"id": "m28", "type": "選擇題", "n": 28, "q": "以下哪段 HTML 會產生「有編號的主列表」，其中第一項下面另有圓點子列表？", "options": ["<ol><li>水果<ul><li>蘋果<\/li><\/ul><\/li><\/ol>", "<ul><li>水果<ol><li>蘋果<\/li><\/ol><\/li><\/ul>", "<ol><li>水果<\/li><li>蘋果<\/li><\/ol>", "<ul><li>水果<\/li><li>蘋果<\/li><\/ul>"], "answer": 0, "note": "", "extra": ""}, {"id": "m29", "ty  if(q.type==='填空題'){

  if(['f3','f8','f9'].includes(q.id))ok=q.accept.includes(v.replace(/\s+\/>$/,'/>').replace(/\s+>$/,'>'));
  if(q.id==='f5')ok=ok||/^rgb\(\s*0\s*,\s*0\s*,\s*255\s*\)$/.test(v)||/^rgb\(\s*0\s+0\s+255\s*\)$/.test(v)||/^rgba\(\s*0\s*,\s*0\s*,\s*255\s*,\s*1\s*\)$/.test(v)||/^hsl\(\s*240\s*,\s*100%\s*,\s*50%\s*\)$/.test(v);
  return {status:ok?'correct':'wrong',message:v?'':'未作答。'};
 }

function parseCode(source){
 let root={tag:'#root',children:[],text:''},stack=[root],all=[],issue=[],uncertain=false,doctype=false;
 const voids=new Set('area base br col embed hr img input link meta param source track wbr'.split(' '));
 const allowed=new Set('html head body title meta link h1 h2 h3 p img a ul ol li div span strong em b i br hr table tr td th caption tbody thead tfoot'.split(' '));
 const tokens=source.match(/<!--[\s\S]*?-->|<!doctype[^>]*>|<\/?[a-zA-Z][^>"']*(?:(?:"[^"]*"|'[^']*')[^>"']*)*>|[^<]+|</gi)||[];
 for(const token of tokens){
  if(token.startsWith('<!--'))continue;
  if(/^<!doctype/i.test(token)){doctype=/^<!doctype\s+html\s*>$/i.test(token);continue}
  if(token[0]!=='<'){stack[stack.length-1].children.push({tag:'#text',text:token,children:[]});continue}
  let m=token.match(/^<(\/)?([a-zA-Z][\w:-]*)([\s\S]*?)>$/);if(!m){uncertain=true;continue}
  let tag=m[2].toLowerCase();if(!allowed.has(tag))uncertain=true;
  if(m[1]){if(voids.has(tag)){issue.push('空元素 '+tag+' 不應有結束標籤');continue}if(stack[stack.length-1].tag===tag){stack.pop();continue}if(['li','p'].includes(stack[stack.length-1].tag)&&stack.length>2&&stack[stack.length-2].tag===tag){stack.pop();stack.pop();continue}issue.push('標籤 '+tag+' 結束次序不正確');continue}
  if(tag==='li'&&stack[stack.length-1].tag==='li')stack.pop();
  if(stack[stack.length-1].tag==='p'&&['p','h1','h2','div','ul','ol','table','hr'].includes(tag))stack.pop();
  const attrs={};let raw=m[3].replace(/\/\s*$/,'');let rest=raw.replace(/([^\s=<>"']+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'=<>`]+)))?/g,(_,key,a,b,c)=>{key=key.toLowerCase();if(key in attrs)uncertain=true;attrs[key]=a??b??c??'';return ''});
  if(rest.trim())uncertain=true;
  if('style' in attrs||'hidden' in attrs||Object.keys(attrs).some(k=>k.startsWith('on')))uncertain=true;
  const parent=stack[stack.length-1],n={tag,attrs,children:[],parent};parent.children.push(n);all.push(n);
  if(['ul','ol'].includes(parent.tag)&&tag!=='li')issue.push('子列表必須放在父 li 內');
  if(tag==='li'&&!['ul','ol'].includes(parent.tag))issue.push('li 必須放在列表內');
  if(!voids.has(tag))stack.push(n);
 }
 const unclosed=stack.slice(1).filter(n=>!['li','p'].includes(n.tag));if(unclosed.length)issue.push('尚未結束：'+unclosed.map(n=>n.tag).join('、'));
 return {root,all,doctype,issue,uncertain};

function textOf(n){return n.tag==='#text'?n.text.replace(/&#(x[0-9a-f]+|\d+);/gi,(_,v)=>{let x=v[0].toLowerCase()==='x'?parseInt(v.slice(1),16):Number(v);return x<=0x10ffff?String.fromCodePoint(x):''}).replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>'):(n.children||[]).map(textOf).join('')}
function gradeProgram(q,source){

 let checks=[];const record=(label,ok)=>checks.push({label,ok});const nodes=tag=>tree.all.filter(n=>n.tag===tag);const r=tag=>ref.all.find(n=>n.tag===tag);const inBody=n=>{for(let x=n.parent;x;x=x.parent)if(x.tag==='body')return true;return false};
 record('HTML5 文件宣告',tree.doctype&&/^\s*(?:<!--[\s\S]*?-->\s*)*<!doctype\s+html\s*>/i.test(source));
 const html=nodes('html'),head=nodes('head'),body=nodes('body');
 record('html、head、body 結構及結束標籤',html.length===1&&head.length===1&&body.length===1&&html[0].parent===tree.root&&head[0].parent===html[0]&&body[0].parent===html[0]&&html[0].children.indexOf(head[0])<html[0].children.indexOf(body[0])&&tree.issue.length===0);
 record('瀏覽器分頁標題',nodes('title').some(n=>n.parent.tag==='head'&&compact(textOf(n))===compact(textOf(r('title')))));
 for(const tag of ['h1','p','h2'])record(({h1:'網頁大標題',p:'歡迎段落',h2:'小標題'})[tag],nodes(tag).some(n=>inBody(n)&&compact(textOf(n))===compact(textOf(r(tag)))));
 const image=r('img');record('圖片檔名及替代文字',nodes('img').some(n=>inBody(n)&&n.attrs.src?.replace(/^\.\//,'')===image.attrs.src&&n.attrs.alt===image.attrs.alt));
 const list=ref.all.find(n=>['ul','ol'].includes(n.tag)),expected=list.children.filter(n=>n.tag==='li').map(n=>compact(textOf(n)));
 record('列表類型、項目及順序',nodes(list.tag).some(n=>inBody(n)&&JSON.stringify(n.children.filter(x=>x.tag==='li').map(x=>compact(textOf(x))))===JSON.stringify(expected)));
 const link=r('a');record('超連結網址及文字',nodes('a').some(n=>inBody(n)&&n.attrs.href?.replace(/\/$/,'')===link.attrs.href.replace(/\/$/,'')&&compact(textOf(n))===compact(textOf(link))));
 return {status:checks.every(x=>x.ok)?'correct':'wrong',message:tree.issue.length?'需修正：'+[...new Set(tree.issue)].join('；'):'按題目要求核對。',checks};
}

function gradeCorrection(q,source){
 if(snippet(source)===snippet(q.code))return {status:'wrong',message:'尚未更正，請直接修改題目中的錯標籤或漏標籤。'};
 if(!source)return {status:'wrong',message:'請在編輯區保留並更正題目程式碼。'};
 const tree=parseCode(source),ref=parseCode(q.answer);
 if(tree.uncertain)return {status:'pending',message:'有其他寫法未能可靠判斷，請對照參考答案核對。'};
 if(tree.issue.length)return {status:'wrong',message:'仍需更正：'+[...new Set(tree.issue)].join('；')};
 const signature=n=>n.tag==='#text'?compact(textOf(n)):[n.tag,...n.children.filter(c=>c.tag!=='#text'||compact(textOf(c))).flatMap(c=>c.tag==='tbody'?c.children.filter(x=>x.tag!=='#text'||compact(textOf(x))).map(signature):[signature(c)])];
 if(JSON.stringify(signature(tree.root))===JSON.stringify(signature(ref.root)))return {status:'correct',message:'標籤、列表或表格結構已改正，內容完整。'};
 if(compact(textOf(tree.root))!==compact(textOf(ref.root)))return {status:'wrong',message:'請保留題目中的全部文字及其順序，只修改標籤。'};
 return {status:'pending',message:'文字內容已保留，但結構與參考答案不同，請對照核對。'};
}

const STORE={review:'computer-word-review-v1',exam:'computer-word-exam-v2',wrong:'computer-word-wrong-attempts-v1'};
const BANK='computer-word-mistakes-v1';let mode='home',saved={},order=[],submitted=false,bank={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(key,fallback={}){try{let d=JSON.parse(localStorage.getItem(key)||'null');return d&&typeof d==='object'&&!Array.isArray(d)?d:fallback}catch{return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{$('#storage').textContent='瀏覽器未能儲存紀錄，請保留本頁。'}}
function state(q){let s=saved[q.id]||(saved[q.id]={});if(q.type==='改錯題'&&s.correctionVersion!==(q.correctionVersion||3)){s.correctionVersion=q.correctionVersion||3;s.value=q.code;s.checked=false;s.manual=null;}return s}
function attempted(q,s){return q.type==='改錯題'?plain(s.value)!==''&&snippet(s.value)!==snippet(q.code):plain(s.value)!==''}
function snapshot(s){return {value:s.value??'',pairs:[...(s.pairs||[])],corrections:[...(s.corrections||[])],correctionVersion:s.correctionVersion}}
function save(){if(mode==='home')return;write(STORE[mode],mode==='exam'?{answers:saved,submitted,ids:order.map(q=>q.id)}:saved);write(BANK,bank);progress();homeCount()}
function homeCount(){$('#wrong-home-count').textContent=Object.keys(bank).filter(id=>QUESTIONS.some(q=>q.id===id)).length+' 題待重溫'}
function remember(q,s,g){if(g.status==='wrong'){bank[q.id]={previous:snapshot(s),source:mode,updated:Date.now()}}else if(g.status==='correct'){delete bank[q.id]}else if(bank[q.id])bank[q.id].previous=snapshot(s)}
function check(q,s){s.checked=true;s.manual=null;s.evaluation=grade(q,s);remember(q,s,s.evaluation)}
function evaluation(q,s){if(!s.checked)return null;let g=grade(q,s);if(g.status==='pending'&&s.manual)return {...g,status:s.manual,message:'已自行核對。'};return g}
function progress(){if(mode==='home')return;$('#progress').textContent=mode==='exam'?(submitted?'已交卷。下方直接顯示核對結果；錯題已加入獨立的「錯題重溫」。':`已作答 ${order.filter(q=>attempted(q,state(q))).length} / 17 題 · 交卷後顯示答案`):mode==='wrong'?`錯題重溫 · 本次 ${order.length} 題 · 答對後自動移出錯題簿`:`已核對 ${order.filter(q=>state(q).checked).length} / ${QUESTIONS.length} 題`}
function correctionDiff(q){
 const tokenize=code=>(code.match(/<[^>]*>|[^<]+/g)||[]).flatMap(part=>part.startsWith('<')?[{raw:part,key:part.replace(/\s+/g,'').toLowerCase()}]:part.split(/(\s+)/).filter(Boolean).map(raw=>({raw,key:raw.trim()})));
 const before=tokenize(q.code),after=tokenize(q.answer),a=before.filter(t=>t.key),b=after.filter(t=>t.key);
 const dp=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));
 for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i].key===b[j].key?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 let i=0,j=0;while(i<a.length&&j<b.length){if(a[i].key===b[j].key){a[i].same=b[j].same=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 const show=(tokens,kind)=>tokens.map(t=>t.key&&!t.same?`<mark class="diff-${kind}" title="${kind==='old'?'寫錯、刪除或移位前的標籤':'改正、補回或移位後的標籤'}">${esc(t.raw)}</mark>`:esc(t.raw)).join('');
 return `<div class="diff-legend"><span><mark class="diff-old">紅色＋刪除線</mark> 寫錯、刪除或移位前</span><span><mark class="diff-new">綠色＋底線</mark> 改正、補回或移位後</span></div><p class="muted">左右對照標示位置；沒有標色的部分毋須更改。移動標籤會在兩邊分別標示。</p><div class="diff-columns"><section><h3>題目程式碼</h3><pre aria-label="題目程式碼，紅色刪除線為需要修改的部分">${show(before,'old')}</pre></section><section><h3>正確參考答案</h3><pre aria-label="正確參考答案，綠色底線為更正或補回的部分">${show(after,'new')}</pre></section></div>`;
}

function answerText(q){return q.options?`${'ABCD'[q.answer]}. ${q.options[q.answer]}`:q.answer}
function resultHTML(q,s){const g=evaluation(q,s);if(!g)return '';let label={correct:'正確',wrong:'不正確',pending:'待核對'}[g.status];return `<div class="feedback ${g.status}" role="status"><strong>${label}</strong>${g.message?`<p>${esc(g.message)}</p>`:''}${g.status==='wrong'&&q.options?`<p>正確答案：${esc(answerText(q))}</p>`:''}${g.status==='wrong'&&q.type==='填空題'?`<p>正確答案：${esc(q.answer)}</p>`:''}${g.checks?`<ul>${g.checks.map(c=>`<li>${c.ok?'✓ 正確':'✗ 需更正'}：${esc(c.label)}</li>`).join('')}</ul>`:''}${g.status==='pending'?'<div class="manual-actions"><button data-manual="correct">核對後：正確</button><button data-manual="wrong">核對後：不正確</button></div>':''}</div>`}
function previousText(q,s){if(q.options)return plain(s.value)===''?'未作答':`${'ABCD'[Number(s.value)]}. ${q.options[Number(s.value)]??''}`;if(q.type==='改錯題')return s.correctionVersion===(q.correctionVersion||3)?(s.value||'未作答'):'這是舊版分段練習紀錄，請直接修改本題程式碼。';return s.value||'未作答'}
function render(){let type=$('#type').value;let list=order.filter(q=>type==='全部題型'||q.type===type);$('#questions').innerHTML=list.map(q=>{
 const s=state(q),reveal=mode!=='exam'||submitted,g=reveal?evaluation(q,s):null;
 let form='';if(q.options)form='<div class="options">'+q.options.map((v,i)=>`<label class="option ${g?(i===q.answer?'answer-correct':String(s.value)===String(i)?'answer-wrong':''):''}"><input type="radio" name="${q.id}" value="${i}" ${String(s.value)===String(i)?'checked':''}><span><span class="letter">${'ABCD'[i]}.</span> ${esc(v)} ${g&&i===q.answer?'<b>✓ 正確答案</b>':''}${g&&String(s.value)===String(i)&&i!==q.answer?'<b>✗ 你的答案</b>':''}</span></label>`).join('')+'</div>';
 else if(q.type==='填空題')form=`<label>填寫答案<input class="field" name="${q.id}" value="${esc(s.value||'')}" autocomplete="off" spellcheck="false"></label>`;
 else if(q.type==='改錯題')form=`<label>直接修改程式碼<textarea class="field correction-editor" name="${q.id}" spellcheck="false">${esc(s.value??q.code)}</textarea></label>`;
 else form=`<label>你的完整 HTML 程式碼<textarea class="field" name="${q.id}" spellcheck="false">${esc(s.value||'')}</textarea></label><p class="muted">按「核對答案」逐項檢查題目要求。特殊寫法會列為待核對。</p>`;
 return `<article class="card" data-id="${q.id}"><span class="badge">${q.type} ${q.n}</span><h2 class="q">${esc(q.q)}</h2>${mode==='wrong'&&s.previous?`<details><summary>查看上次作答</summary><pre>${esc(previousText(q,s.previous))}</pre></details>`:''}${q.requirements?'<div class="prompt-layout">':''}${q.code&&q.type!=='改錯題'?`<pre>${esc(q.code)}</pre>`:''}${q.extra?`<pre>${esc(q.extra)}</pre>`:''}${q.requirements?`<ol class="requirements">${q.requirements.map(x=>`<li>${esc(x.replace(/^\d+\.\s*/,''))}</li>`).join('')}</ol>`:''}${q.image?`<figure class="question-figure"><a href="${esc(q.image)}" target="_blank" rel="noopener" aria-label="放大查看：${esc(q.imageAlt)}"><img src="${esc(q.image)}" alt="${esc(q.imageAlt)}" loading="lazy"></a><figcaption>點擊圖片可放大</figcaption></figure>`:''}${q.requirements?'</div>':''}<fieldset class="response" ${mode==='exam'&&submitted?'disabled':''}>${form}</fieldset>${mode!=='exam'?'<button data-check>核對答案</button>':''}<div data-feedback>${g?resultHTML(q,s):''}</div>${reveal?`<details data-answer ${s.open?'open':''}><summary>參考答案與核對</summary><div class="answer">${q.notes?q.notes.map(n=>`<p>${esc(n)}</p>`).join(''):''}${q.type==='改錯題'?correctionDiff(q):`<pre>${esc(answerText(q))}</pre>`}</div></details>`:''}</article>`
 }).join('')||'<p class="note">目前沒有這個題型的錯題。你可以返回首頁開始新的練習。</p>';
 document.querySelectorAll('[data-answer]').forEach(d=>d.addEventListener('toggle',()=>{let s=saved[d.closest('article').dataset.id];if(s){s.open=d.open;save()}answerLabel()}));progress();answerLabel();
}
function answerLabel(){let ds=[...document.querySelectorAll('[data-answer]')];$('#answers').textContent=ds.length&&ds.every(d=>d.open)?'隱藏全部答案':'顯示全部答案'}
function drawExam(){return [['選擇題',10],['填空題',5],['改錯題',1],['程式題',1]].flatMap(([type,n])=>{let a=QUESTIONS.filter(q=>q.type===type);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)})}
function validExam(ids){if(!Array.isArray(ids)||ids.length!==17||new Set(ids).size!==17)return false;let a=ids.map(id=>QUESTIONS.find(q=>q.id===id));return a.every(Boolean)&&[['選擇題',10],['填空題',5],['改錯題',1],['程式題',1]].every(([t,n])=>a.filter(q=>q.type===t).length===n)}
function updateMode(){$('#mode-title').textContent=mode==='exam'?(submitted?'模擬測試 · 已交卷':'模擬測試'):mode==='wrong'?'錯題重溫':'複習模式';$('#answers').hidden=mode==='exam'&&!submitted;$('#shuffle').hidden=mode==='exam';$('#reset').hidden=mode!=='review';$('#submit-test').hidden=mode!=='exam'||submitted;$('#new-test').hidden=mode!=='exam';$('#wrong-review').hidden=mode==='wrong'||(mode==='exam'&&!submitted);$('#storage').textContent=mode==='wrong'?'這裏只收錄需要重溫的錯題。重新作答並核對，答對後會移出錯題簿。':mode==='exam'?'作答自動儲存。交卷前不顯示答案；未能可靠判斷的寫法可自行核對。':'選擇題選答後即顯示結果；其他題可按「核對答案」。錯題自動加入錯題簿。'}
function enterMode(next){if(mode!=='home')save();mode=next;submitted=false;bank=read(BANK);saved=read(STORE[mode]);order=[...QUESTIONS];
 if(mode==='exam'){const data=saved;saved={};order=drawExam();if(validExam(data.ids)){order=data.ids.map(id=>QUESTIONS.find(q=>q.id===id));saved=data.answers||{};submitted=data.submitted===true;if(submitted)order.forEach(q=>{state(q).checked=true})}}
 if(mode==='wrong'){order=QUESTIONS.filter(q=>bank[q.id]);for(const q of order){let s=state(q),record=bank[q.id];if(s.bankVersion!==record.updated)saved[q.id]={previous:record.previous,bankVersion:record.updated};}}
 $('#type').value='全部題型';$('#home').hidden=true;$('#session').hidden=false;updateMode();save();render();window.scrollTo({top:0,behavior:'smooth'})}
$('#questions').addEventListener('input',e=>{const a=e.target.closest('article');if(!a||mode==='exam'&&submitted)return;const q=QUESTIONS.find(q=>q.id===a.dataset.id),s=state(q);s.value=e.target.value;s.checked=false;s.manual=null;a.querySelector('[data-feedback]').innerHTML='';save();if(q.options&&mode!=='exam'){check(q,s);save();render()}});
$('#questions').addEventListener('click',e=>{const a=e.target.closest('article');if(!a)return;const q=QUESTIONS.find(q=>q.id===a.dataset.id),s=state(q);if(e.target.closest('[data-check]')&&mode!=='exam'){check(q,s);save();render()}else if(e.target.hasAttribute('data-manual')&&(mode!=='exam'||submitted)){s.manual=e.target.dataset.manual;s.checked=true;remember(q,s,{status:s.manual});save();render()}});
$('#type').onchange=render;
$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}render()};
$('#answers').onclick=()=>{const ds=[...document.querySelectorAll('[data-answer]')],open=!ds.every(d=>d.open);ds.forEach(d=>{d.open=open;state(QUESTIONS.find(q=>q.id===d.closest('article').dataset.id)).open=open});save();answerLabel()};
$('#review-mode').onclick=()=>enterMode('review');$('#exam-mode').onclick=()=>enterMode('exam');$('#wrong-mode').onclick=()=>enterMode('wrong');$('#wrong-review').onclick=()=>enterMode('wrong');
$('#home-button').onclick=()=>{save();mode='home';$('#session').hidden=true;$('#home').hidden=false;$('#questions').innerHTML='';homeCount();window.scrollTo({top:0,behavior:'smooth'})};
$('#submit-test').onclick=()=>{if(mode!=='exam'||submitted)return;let missing=order.filter(q=>!attempted(q,state(q))).length;if(!confirm(missing?`還有 ${missing} 題未作答，確定交卷？`:'確定交卷並核對？'))return;submitted=true;order.forEach(q=>check(q,state(q)));$('#type').value='全部題型';save();updateMode();render();$('#mode-title').scrollIntoView({behavior:'smooth'})};
$('#new-test').onclick=()=>{if(confirm('重新抽題？本次作答將清除，已收錄的錯題會保留。')){saved={};submitted=false;order=drawExam();$('#type').value='全部題型';save();updateMode();render()}};
$('#reset').onclick=()=>{if(confirm('清除複習作答？錯題簿會保留。')){saved={};save();render()}};
// Import checked mistakes from earlier versions without discarding existing mistakes.
bank=read(BANK);if(!read('computer-word-mistakes-import-v1').done){for(const [source,key] of [['review',STORE.review],['exam',STORE.exam]]){const d=read(key),answers=source==='exam'?d.answers||{}:d;for(const q of QUESTIONS){const s=answers[q.id];if(!s||bank[q.id])continue;if(s.checked||source==='exam'&&d.submitted){const g=grade(q,s);if(g.status==='wrong'||s.wrong)bank[q.id]={previous:snapshot(s),source,updated:Date.now()}}}}
write('computer-word-mistakes-import-v1',{done:true});}
write(BANK,bank);homeCount();

</script></body></html>
