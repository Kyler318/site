"note":"","extra":""},{"id":"m32","type":"選擇題","n":32,"q":"HTML 主要負責甚麼？","options":["編輯圖片像素","控制電腦音量","描述網頁結構與內容","儲存試算表公式"],"answer":2,"note":"","extra":""},{"id":"m33","type":"選擇題","n":33,"q":"瀏覽器會怎樣處理 HTML？","options":["讀取標記並顯示網頁","只會下載，不會顯示","自動變成 Word 文件","當成音樂播放"],"answer":0,"note":"","extra":""},{"id":"m34","type":"選擇題","n":34,"q":"下列哪個標籤用來建立段落？","options":["<h1>","<p>","<hr>","<img>"],"answer":1,"note":"","extra":""},{"id":"m35","type":"選擇題","n":35,"q":"下列哪個標籤用來換行？","options":["<br>","<a>","<ol>","<td>"],"answer":0,"note":"","extra":""},{"id":"m36","type":"選擇題","n":36,"q":"下列哪個標籤通常用來顯示水平分隔線？","options":["<p>","<title>","<hr>","<li>"],"answer":2,"note":"","extra":""},{"id":"m37","type":"選擇題","n":37,"q":"哪一組都是空元素（void elements），不可加上結束標籤？","options":["<p> 和 <h1>","<ul> 和 <ol>","<table> 和 <tr>","<br> 和 <hr>"],"answer":3,"note":"","extra":""},{"id":"m38","type":"選擇題","n":38,"q":"關於 <title> 和 <h1>，哪項正確？","options":["兩者都必須放在 <body>","<title> 是分頁標題，<h1> 是網頁內標題","<h1> 只能放在 <head>","兩者都用來放圖片"],"answer":1,"note":"","extra":""},{"id":"m39","type":"選擇題","n":39,"q":"以下哪種檔名實際上是文字檔而非 .html 網頁檔？","options":["index.html.txt","index.html","home.html","page2.html"],"answer":0,"note":"","extra":""},{"id":"m40","type":"選擇題","n":40,"q":"圖片和 HTML 檔案放在同一資料夾，圖片名為 dog.jpg，src 最簡單可以寫甚麼？","options":["images/dog.jpg","../dog.jpg","dog.jpg","https://dog.jpg"],"answer":2,"note":"","extra":""},{"id":"f1","type":"填空題","n":1,"q":"HTML 網頁檔案常用的副檔名是「_________」。","answer":".html 或 .htm（也接受 html、htm）","accept":[".html","html",".htm","htm"],"note":""},{"id":"f2","type":"填空題","n":2,"q":"在<img>標籤中，用來指定圖片檔案位置的屬性是「_________」。","answer":"src","accept":["src"],"note":""},{"id":"f3","type":"填空題","n":3,"q":"如果想在網頁中建立一個可以點擊的超連結，應使用「_________」標籤。","answer":"<a>","accept":["<a>","a"],"note":""},{"id":"f4","type":"填空題","n":4,"q":"如果想將文字大小設定為 30 像素，可以使用 font-size: _________ ; 。","answer":"30px","accept":["30px"],"note":""},{"id":"f5","type":"填空題","n":5,"q":"如果想將文字顏色設定為藍色，可以使用 color: _________ ;。","answer":"blue","accept":["blue","#0000ff","#00f","rgb(0,0,255)"],"note":""},{"id":"f6","type":"填空題","n":6,"q":"如果把 HTML 檔案命名為 index.html.txt，它真正的副檔名是「_________」。","answer":".txt（或 txt）","accept":[".txt","txt"],"note":""},{"id":"f7","type":"填空題","n":7,"q":"在 <a> 標籤中，用來指定連結目的地網址的屬性是「_________」。","answer":"href","accept":["href"],"note":""},{"id":"f8","type":"填空題","n":8,"q":"如果想在網頁中換行，而不需要建立新的段落，可以使用「_________」標籤。","answer":"<br>","accept":["<br>","<br/>","br"],"note":""},{"id":"f9","type":"填空題","n":9,"q":"在 HTML 中，建立表格時，最外層應使用「_________」標籤。","answer":"<table>","accept":["<table>","table"],"note":""},{"id":"f10","type":"填空題","n":10,"q":"在 HTML 中，建立有數字編號的列表時，應使用「_________」標籤。","answer":"<ol>","accept":["<ol>","ol"],"note":""},{"id":"f11","type":"填空題","n":11,"q":"在 HTML 表格中，用來建立「一列」的標籤是「_________」。","answer":"<tr>","accept":["<tr>","tr"],"note":""},{"id":"f12","type":"填空題","n":12,"q":"在 <img> 標籤中，用來設定圖片無法顯示時替代文字的屬性是「_________」。","answer":"alt","accept":["alt"],"note":""},{"id":"f13","type":"填空題","n":13,"q":"HTML 中字體最大的標題標籤是「_________」。","answer":"<h1>","accept":["<h1>","h1"],"note":""},{"id":"f14","type":"填空題","n":14,"q":"如果想將文字置中對齊，可以使用 text-align: _________ ; 。","answer":"center","accept":["center"],"note":""},{"id":"f15","type":"填空題","n":15,"q":"用來設定網頁背景顏色的 CSS 屬性是「_________」。","answer":"background-color（也接受 background）","accept":["background-color","background"],"note":""},{"id":"f16","type":"填空題","n":16,"q":"在 HTML 中，用來建立段落的標籤是「_________」。","answer":"<p>","accept":["<p>","p"],"note":""},{"id":"f17","type":"填空題","n":17,"q":"列表中的每一個項目都要使用「_________」標籤。","answer":"<li>","accept":["<li>","li"],"note":""},{"id":"e1","type":"改錯題","n":1,"q":"以下 HTML 程式碼共有 5 個錯處。直接修改錯誤標籤，保留原有內容，完成後按「核對答案」。","notes":["1.「分數」後的 </td> 改為 </th>，與標題儲存格的開始標籤配對。","2.「90」後的 <td> 補上 /，改為 </td>，結束該儲存格。","3. 小美所在列開首的 <td> 改為 <tr>，表示新的一列。","4. 小華所在列中，「電腦」後的 </th> 改為 </td>，與一般儲存格的開始標籤配對。","5. 最後的 </tabel> 改為 </table>，修正拼寫並結束整個表格。"],"answer":"<table>\n  <tr>\n    <th>姓名</th><th>科目</th>\n    <th>分數</th>\n  </tr>\n  <tr>\n    <td>小明</td><td>電腦</td>\n    <td>90</td>\n  </tr>\n  <tr>\n    <td>小美</td><td>電腦</td>\n    <td>85</td>\n  </tr>\n  <tr>\n    <td>小華</td><td>電腦</td>\n    <td>95</td>\n  </tr>\n</table>","note":"","correctionVersion":6,"code":"<table>\n  <tr>\n    <th>姓名</th><th>科目</th>\n    <th>分數</td>\n  </tr>\n  <tr>\n    <td>小明</td><td>電腦</td>\n    <td>90<td>\n  </tr>\n  <td>\n    <td>小美</td><td>電腦</td>\n    <td>85</td>\n  </tr>\n  <tr>\n    <td>小華</td><td>電腦</th>\n    <td>95</td>\n  </tr>\n</tabel>"},{"id":"e2","type":"改錯題","n":2,"q":"以下 HTML 程式碼共有 5 個錯處。直接修改錯誤標籤，保留原有內容，完成後按「核對答案」。","notes":["1. 大標題後的 </h2> 改為 </h1>，與開始標籤配對。","2. 足球後的 </ol> 改為 </li>，結束列表項目。","3. 結他後的 </ol> 改為 </li>，結束列表項目。","4. 攝影後的 </ul> 改為 </li>，結束列表項目。","5. 最後的 </ul> 改為 </ol>，與最外層有編號列表的開始標籤配對。"],"answer":"<h1>我的課外活動</h1>\n<ol>\n    <li>體育活動\n        <ul>\n            <li>籃球</li>\n            <li>足球</li>\n        </ul>\n    </li>\n    <li>音樂活動\n        <ul>\n            <li>鋼琴</li>\n            <li>結他</li>\n        </ul>\n    </li>\n    <li>藝術活動\n        <ul>\n            <li>繪畫</li>\n            <li>攝影</li>\n        </ul>\n    </li>\n</ol>","note":"","correctionVersion":5,"code":"<h1>我的課外活動</h2>\n<ol>\n    <li>體育活動\n        <ul>\n            <li>籃球</li>\n            <li>足球</ol>\n        </ul>\n    </li>\n    <li>音樂活動\n        <ul>\n            <li>鋼琴</li>\n            <li>結他</ol>\n        </ul>\n    </li>\n    <li>藝術活動\n        <ul>\n            <li>繪畫</li>\n            <li>攝影</ul>\n        </ul>\n    </li>\n</ul>"},{"id":"e3","type":"改錯題","n":3,"q":"以下 HTML 程式碼共有 5 個錯處。直接修改錯誤標籤，保留原有內容，完成後按「核對答案」。","notes":["1. 足球後的 </ol> 改為 </li>，結束列表項目。","2. 結他後的 </ol> 改為 </li>，與列表項目的開始標籤配對。","3. 漫畫後的 </ul> 改為 </li>，結束列表項目。","4. 旅行後的 </il> 改為 </li>，修正標籤拼寫。","5. 最後的 </ol> 改為 </ul>，與最外層圓點列表的開始標籤配對。"],"answer":"<h1>我的興趣</h1>\n<ul>\n    <li>球類運動\n        <ol>\n            <li>籃球</li>\n            <li>足球</li>\n        </ol>\n    </li>\n    <li>音樂\n        <ul>\n            <li>鋼琴</li>\n            <li>結他</li>\n        </ul 核對答案」。","notes":["1. 開首的 <h2> 改為 <h1>，與結束標籤 </h1> 配對。","2. 練習打字後的 </il> 改為 </li>，修正標籤拼寫。","3. 星期一子列表最後的 <ul> 補上 /，改為 </ul>，結束子列表。","4. 溫習英文後的 </ol> 改為 </li>，結束列表項目。","5. 最後段落的 </b> 改為 </p>，與段落的開始標籤配對。"],"answer":"<h1>我的一週計劃</h1>\n<ol>\n    <li>星期一\n        <ul>\n            <li>上電腦課</li>\n            <li>練習打字</li>\n        </ul>\n    </li>\n    <li>星期三\n        <ul>\n            <li>參加籃球隊</li>\n            <li>溫習英文</li>\n        </ul>\n    </li>\n</ol>\n<p>努力完成計劃！</p>","note":"","correctionVersion":1,"code":"<h2>我的一週計劃</h1>\n<ol>\n    <li>星期一\n        <ul>\n            <li>上電腦課</li>\n            <li>練習打字</il>\n        <ul>\n    </li>\n    <li>星期三\n        <ul>\n            <li>參加籃球隊</li>\n            <li>溫習英文</ol>\n        </ul>\n    </li>\n</ol>\n<p>努力完成計劃！</b>"},{"id":"c1","type":"程式題","n":1,"q":"請根據以下要求，手寫完整的 HTML 程式碼，製作「我的校園生活」網頁。","requirements":["1. 使用 <!DOCTYPE html> 宣告 HTML5 文件。","2. 正確使用 <html>、<head>、<body> 及其結束標籤。","3. 使用 <title> 將瀏覽器分頁標題設定為「我的校園生活」。","4. 使用 <h1> 顯示「我的校園生活」，並以 <p> 顯示「歡迎來到我的校園生活網頁！」。","5. 插入圖片 school.jpg，並設定 alt=\"校園照片\"。","6. 使用<h2>顯示我喜歡的科目。","7. 使用 <ul> 及 <li> 建立圓點列表，依次列出「電腦」、「英文」及「數學」。","8. 建立超連結，顯示文字「前往學校網站」，連結網址為 https://www.example.com。"],"answer":"<!DOCTYPE html>\n<html>\n<head>\n  <title>我的校園生活</title>\n</head>\n<body>\n  <h1>我的校園生活</h1>\n  <p>歡迎來到我的校園生活網頁！</p>\n  <img src=\"school.jpg\" alt=\"校園照片\">\n  <h2>我喜歡的科目</h2>\n  <ul>\n    <li>電腦</li>\n    <li>英文</li>\n    <li>數學</li>\n  </ul>\n  <a href=\"https://www.example.com\">前往學校網站</a>\n</body>\n</html>","note":"","image":"images/6.png","imageAlt":"我的校園生活網頁效果","extra":""},{"id":"c2","type":"程式題","n":2,"q":"請根據以下要求，手寫完整的 HTML 程式碼，製作「我的旅遊日記」網頁。","requirements":["1. 使用 <!DOCTYPE html> 宣告 HTML5 文件。","2. 正確使用 <html>、<head>、<body> 及其結束標籤。","3. 使用 <title> 將瀏覽器分頁標題設定為「我的旅遊日記」。","4. 使用 <h1> 顯示「我的旅遊日記」，並以 <p> 顯示「歡迎來到我的旅遊分享網頁！」。","5. 插入圖片 travel.jpg，並設定 alt=\"旅遊照片\"。","6. 使用<h2>顯示我想去的地方。","7. 使用 <ol> 及 <li> 建立數字編號列表，依次列出「日本」、「韓國」及「台灣」。","8. 建立超連結，顯示文字「查看更多旅遊資訊」，連結網址為 https://www.example.com。"],"answer":"<!DOCTYPE html>\n<html>\n<head>\n  <title>我的旅遊日記</title>\n</head>\n<body>\n  <h1>我的旅遊日記</h1>\n  <p>歡迎來到我的旅遊分享網頁！</p>\n  <img src=\"travel.jpg\" alt=\"旅遊照片\">\n  <h2>我想去的地方</h2>\n  <ol>\n    <li>日本</li>\n    <li>韓國</li>\n    <li>台灣</li>\n  </ol>\n  <a href=\"https://www.example.com\">查看更多旅遊資訊</a>\n</body>\n</html>","note":"","image":"images/7.png","imageAlt":"我的旅遊日記網頁效果","extra":""},{"id":"c3","type":"程式題","n":3,"q":"請根據以下要求，手寫完整的 HTML 程式碼，製作「我的美食天地」網頁。","requirements":["1. 使用 <!DOCTYPE html> 宣告 HTML5 文件。","2. 正確使用 <html>、<head>、<body> 及其結束標籤。","3. 使用 <title> 將瀏覽器分頁標題設定為「我的美食天地」。","4. 使用 <h1> 顯示「我的美食天地」，並以 <p> 顯示「歡迎來到我的美食分享網頁！」。","5. 插入圖片 food.jpg，並設定 alt=\"美食照片\"。","6. 使用 <h2> 顯示「我喜歡的食物」。","7. 使用 <ul> 及 <li> 建立圓點列表，依次列出「薄餅」、「壽司」及「漢堡包」。","8. 建立超連結，顯示文字「查看更多美食資訊」，連結網址為 https://www.example.com。"],"answer":"<!DOCTYPE html>\n<html>\n<head>\n  <title>我的美食天地</title>\n</head>\n<body>\n  <h1>我的美食天地</h1>\n  <p>歡迎來到我的美食分享網頁！</p>\n  <img src=\"food.jpg\" alt=\"美食照片\">\n  <h2>我喜歡的食物</h2>\n  <ul>\n    <li>薄餅</li>\n    <li>壽司</li>\n    <li>漢堡包</li>\n  </ul>\n  <a href=\"https://www.example.com\">查看更多美食資訊</a>\n</body>\n</html>","note":"","image":"images/5.png","imageAlt":"我的美食天地網頁效果","extra":""},{"id":"c4","type":"程式題","n":4,"q":"請根據以下要求，手寫完整的 HTML 程式碼，製作「我的寵物」網頁。","requirements":["1. 使用 <!DOCTYPE html> 宣告 HTML5 文件。","2. 正確使用 <html>、<head>、<body> 及其結束標籤。","3. 使用 <title> 將瀏覽器分頁標題設定為「我的寵物」。","4. 使用 <h1> 顯示「我的寵物」，並以 <p> 顯示「歡迎來到我的寵物分享網頁！」。","5. 插入圖片 pet.jpg，並設定 alt=\"寵物照片\"。","6. 使用 <h2> 顯示「我養過的動物」。","7. 使用 <ul> 及 <li> 建立圓點列表，依次列出「小狗」、「小貓」及「金魚」。","8. 建立超連結，顯示文字「認識更多寵物知識」，連結網址為 https://www.example.com。"],"answer":"<!DOCTYPE html>\n<html>\n<head>\n  <title>我的寵物</title>\n</head>\n<body>\n  <h1>我的寵物</h1>\n  <p>歡迎來到我的寵物分享網頁！</p>\n  <img src=\"pet.jpg\" alt=\"寵物照片\">\n  <h2>我養過的動物</h2>\n  <ul>\n    <li>小狗</li>\n    <li>小貓</li>\n    <li>金魚</li>\n  </ul>\n  <a href=\"https://www.example.com\">認識更多寵物知識</a>\n</body>\n</html>","note":"","image":"images/8.png","imageAlt":"我的寵物網頁效果","ex function parseCode(source){

function gradeCorrection(q,source){
 if(snippet(source)===snippet(q.code))return {status:'wrong',message:'尚未更正，請直接修改題目中的錯標籤或漏標籤。'};
 if(!source)return {status:'wrong',message:'請在編輯區保留並更正題目程式碼。'};
 const tree=parseCode(source),ref=parseCode(q.answer);
 if(tree.uncertain)return {status:'pending',message:'有其他寫法未能可靠判斷，請對照參考答案核對。'};
 if(tree.issue.length)return {status:'wrong',message:'仍需更正：'+[...new Set(tree.issue)].join('；')};
 const signature=n=>n.tag==='#text'?compact(textOf(n)):[n.tag,...n.children.filter(c=>c.tag!=='#text'||compact(textOf(c))).flatMap(c=>c.tag==='tbody'?c.children.filter(x=>x.tag!=='#text'||compact(textOf(x))).map(signature):[signature(c)])];
 if(JSON.stringify(signature(tree.root))===JSON.stringify(signature(ref.root)))return {status:'correct',message:'標籤、列表或表格結構已改正，內容完整。'};
 if(compact(textOf(tree.root))!==compact(textOf(ref.root)))return {status:'wrong',message:'請保留題目中的全部文字及其順序，只修改標籤。'};
 return {status:'pending',message:'文字內容已保留，但結構與參考答案不同，請對照核對。'};
}

 else if(q.type==='改錯題')form=`<label>直接修改程式碼<textarea class="field correction-editor" name="${q.id}" spellcheck="false">${esc(s.value??q.code)}</textarea></label>`;
 else form=`<label>你的完整 HTML 程式碼<textarea class="field" name="${q.id}" spellcheck="false">${esc(s.value||'')}</textarea></label><p class="muted">按「核對答案」逐項檢查題目要求。特殊寫法會列為待核對。</p>`;
 const card=`<article class="card" data-id="${q.id}"><span class="badge">${q.type} ${q.n}</span><span class="topic-tag">${esc(t.name)}</span><h2 class="q">${esc(q.q)}</h2>${mode==='wrong'&&s.previous?`<details><summary>查看上次作答</summary><pre>${esc(previousText(q,s.previous))}</pre></details>`:''}${q.requirements?'<div class="prompt-layout">':''}${q.code&&q.type!=='改錯題'?`<pre>${esc(q.code)}</pre>`:''}${q.extra?`<pre>${esc(q.extra)}</pre>`:''}${q.requirements?`<ol class="requirements">${q.requirements.map(x=>`<li>${esc(x.replace(/^\d+\.\s*/,''))}</li>`).join('')}</ol>`:''}${q.image?`<figure class="question-figure"><a href="${esc(q.image)}" target="_blank" rel="noopener" aria-label="放大查看：${esc(q.imageAlt)}"><img src="${esc(q.image)}" alt="${esc(q.imageAlt)}" loading="lazy"></a><figcaption>點擊圖片可放大</figcaption></figure>`:''}${q.requirements?'</div>':''}<fieldset class="response" ${mode==='exam'&&submitted?'disabled':''}>${form}</fieldset>${mode!=='exam'?'<button data-check>核對答案</button>':''}<div data-feedback>${g?resultHTML(q,s):''}</div>${reveal?`<details data-answer ${s.open?'open':''}><summary>參考答案與核對</summary><div class="answer">${q.notes&&!g?q.notes.map(n=>`<p>${esc(n)}</p>`).join(''):''}${q.type==='改錯題'?correctionDiff(q):`<pre>${esc(answerText(q))}</pre>${g?'':explainHTML(q)}`}</div></details>`:''}</article>`;
 return head+card}).join('')||`<p class="note">${mode==='wrong'?'目前沒有符合篩選的錯題。你可以返回首頁開始新的練習。':'目前沒有符合篩選的題目。'}</p>`;
 renderTopicMap();
 document.querySelectorAll('[data-answer]').forEach(d=>d.addEventListener('toggle',()=>{let s=saved[d.closest('article').dataset.id];if(s){s.open=d.open;save()}answerLabel()}));progress();answerLabel();
}
function answerLabel(){let ds=[...document.querySelectorAll('[data-answer]')];$('#answers').textContent=ds.length&&ds.every(d=>d.open)?'隱藏全部答案':'顯示全部答案'}
function drawExam(){return [['選擇題',10],['填空題',5],['改錯題',1],['程式題',1]].flatMap(([type,n])=>{let a=QUESTIONS.filter(q=>q.type===type);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)})}
function validExam(ids){if(!Array.isArray(ids)||ids.length!==17||new Set(ids).size!==17)return false;let a=ids.map(id=>QUESTIONS.find(q=>q.id===id));return a.every(Boolean)&&[['選擇題',10],['填空題',5],['改錯題',1],['程式題',1]].every(([t,n])=>a.filter(q=>q.type===t).length===n)}
function updateMode(){$('#mode-title').textContent=mode==='exam'?(submitted?'模擬測試 · 已交卷':'模擬測試'):mode==='wrong'?'錯題重溫':'複習模式';$('#answers').hidden=mode==='exam'&&!submitted;$('#shuffle').hidden=mode==='exam';$('.topic-filter').hidden=true;$('.type-filter').hidden=mode!=='exam';$('#reset').hidden=mode!=='review';$('#submit-test').hidden=mode!=='exam'||submitted;$('#new-test').hidden=mode!=='exam';$('#wrong-review').hidden=mode==='wrong'||(mode==='exam'&&!submitted);$('#storage').textContent=mode==='wrong'?'這裏只收錄需要重溫的錯題。重新作答並核對，答對後會移出錯題簿。':mode==='exam'?'作答自動儲存。交卷前不顯示答案；未能可靠判斷的寫法可自行核對。':'選擇題選答後即顯示結果；其他題可按「核對答案」。錯題自動加入錯題簿。'}
function enterMode(next){if(mode!=='home')save();mode=next;submitted=false;bank=read(BANK);saved=read(STORE[mode]);order=[...QUESTIONS];
 if(mode==='exam'){const data=saved;saved={};order=drawExam();if(validExam(data.ids)){order=data.ids.map(id=>QUESTIONS.find(q=>q.id===id));saved=data.answers||{};submitted=data.submitted===true;if(submitted)order.forEach(q=>{state(q).checked=true})}}
 if(mode==='wrong'){order=QUESTIONS.filter(q=>bank[q.id]);for(const q of order){let s=state(q),record=bank[q.id];if(s.bankVersion!==record.updated)saved[q.id]={previous:record.previous,bankVersion:record.updated};}}
 $('#type').value='全部題型';$('#topic').value='all';$('#home').hidden=true;$('#session').hidden=false;updateMode();save();render();window.scrollTo({top:0,behavior:'smooth'})}
$('#questions').addEventListener('input',e=>{const a=e.target.closest('article');if(!a||mode==='exam'&&submitted)return;const q=QUESTIONS.find(q=>q.id===a.dataset.id),s=state(q);s.value=e.target.value;s.checked=false;s.manual=null;a.querySelector('[data-feedback]').innerHTML='';save();if(q.options&&mode!=='exam'){check(q,s);save();render()}});
$('#questions').addEventListener('click',e=>{const a=e.target.closest('article');if(!a)return;const q=QUESTIONS.find(q=>q.id===a.dataset.id),s=state(q);if(e.target.closest('[data-check]')&&mode!=='exam'){check(q,s);save();render()}else if(e.target.hasAttribute('data-manual')&&(mode!=='exam'||submitted)){s.manual=e.target.dataset.manual;s.checked=true;remember(q,s,{status:s.manual});save();render()}});
$('#type').onchange=render;
$('#topic').innerHTML+=TOPICS.map(t=>`<option value="${t.key}">${t.index+1}. ${esc(t.name)}</option>`).join('');
$('#topic').onchange=render;
$('#topic-map').addEventListener('click',e=>{const b=e.target.closest('[data-topic],[data-type]');if(!b||b.disabled)return;if(b.dataset.type){$('#type').value=b.dataset.type;const t=$('#topic').value;if(t!=='all'&&!order.some(q=>TOPIC_OF[q.id].key===t&&typeOk(q)))$('#topic').value='all';render();return}$('#topic').value=b.dataset.topic;render();$('.topic-step').scrollIntoView({behavior:'smooth'})});
$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}render()};
$('#answers').onclick=()=>{const ds=[...document.querySelectorAll('[data-answer]')],open=!ds.every(d=>d.open);ds.forEach(d=>{d.open=open;state(QUESTIONS.find(q=>q.id===d.closest('article').dataset.id)).open=open});save();answerLabel()};
$('#review-mode').onclick=()=>enterMode('review');$('#exam-mode').onclick=()=>enterMode('exam');$('#wrong-mode').onclick=()=>enterMode('wrong');$('#wrong-review').onclick=()=>enterMode('wrong');
$('#home-button').onclick=()=>{save();mode='home';$('#session').hidden=true;$('#home').hidden=false;$('#questions').innerHTML='';homeCount();window.scrollTo({top:0,behavior:'smooth'})};
$('#submit-test').onclick=()=>{if(mode!=='exam'||submitted)return;let missing=order.filter(q=>!attempted(q,state(q))).length;if(!confirm(missing?`還有 ${missing} 題未作答，確定交卷？`:'確定交卷並核對？'))return;submitted=true;order.forEach(q=>check(q,state(q)));$('#type').value='全部題型';save();updateMode();render();$('#mode-title').scrollIntoView({behavior:'smooth'})};
$('#new-test').onclick=()=>{if(confirm('重新抽題？本次作答將清除，已收錄的錯題會保留。')){saved={};submitted=false;order=drawExam();$('#type').value='全部題型';save();updateMode();render()}};
$('#reset').onclick=()=>{if(confirm('清除複習作答？錯題簿會保留。')){saved={};save();render()}};
// Import checked mistakes from earlier versions without discarding existing mistakes.
bank=read(BANK);if(!read('computer-word-mistakes-import-v1').done){for(const [source,key] of [['review',STORE.review],['exam',STORE.exam]]){const d=read(key),answers=source==='exam'?d.answers||{}:d;for(const q of QUESTIONS){const s=answers[q.id];if(!s||bank[q.id])continue;if(s.checked||source==='exam'&&d.submitted){const g=grade(q,s);if(g.status==='wrong'||s.wrong)bank[q.id]={previous:snapshot(s),source,updated:Date.now()}}}}
write('computer-word-mistakes-import-v1',{done:true});}
write(BANK,bank);homeCount();

</script></body></html>
